appId: com.typeless.rebuild
productName: YU
electronLanguages:
  - zh-CN
  - en-US
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - resources/icon.png
  - resources/tray/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - licenses/**
extraResources:
  - from: resources/voice-wake.ps1
    to: voice-wake.ps1
  - from: resources/windows-tools.ps1
    to: windows-tools.ps1
  - from: resources/speech.ps1
    to: speech.ps1
  - from: resources/installer.ico
    to: shortcut.ico
asar: true
# The recogniser is a native addon plus its DLLs: neither can be loaded from
# inside an asar archive, and the addon finds its runtime by looking at a sibling
# directory (`../sherpa-onnx-win-x64`). Unpacking both packages side by side keeps
# that lookup working in the installed build, which is what "这个版本没有带本地识别运行时"
# used to report before they were shipped.
asarUnpack:
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-win-x64/**
  - node_modules/koffi/**
# The shipped feed is the project's own GitHub releases: `/releases/latest/download/`
# always serves the newest release's assets, so releasing is "upload rc.yml + setup
# + blockmap" with no update server to run. TYPELESS_UPDATE_URL (or
# <userData>/update-feed.txt) still overrides it, and TYPELESS_NO_UPDATE=1 disables
# checks entirely. Keep the channel in sync with `version` in package.json: a
# prerelease such as 1.0.0-rc.6 publishes `rc.yml`, a stable one publishes `latest.yml`.
publish:
  provider: generic
  url: https://github.com/sqslm/YU/releases/latest/download
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/app.ico
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  # Keeps `models\` alive across upgrades — see build/installer.nsh.
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: YU
  installerIcon: resources/installer.ico
  uninstallerIcon: resources/installer.ico
  deleteAppDataOnUninstall: false
