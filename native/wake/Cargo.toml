[package]
name = "yu-wake"
version = "0.1.0"
edition = "2024"

[dependencies]

[target.'cfg(windows)'.dependencies]
serde_json = "=1.0.151"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Speech",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
