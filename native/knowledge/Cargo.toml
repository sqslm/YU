[package]
name = "yu-knowledge"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "yu-knowledge"
path = "src/main.rs"

# Test-only closed-loop fixture. Never enabled by the native build script, so it
# is not produced by a packaging build and never reaches native/bin.
[[bin]]
name = "yu-knowledge-fixture"
path = "bin/fixture.rs"
required-features = ["fixture"]

[features]
fixture = []

[dependencies]
# Pinned: the knowledge/profile databases must be readable by any later build.
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
