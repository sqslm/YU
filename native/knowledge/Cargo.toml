[package]
name = "yu-knowledge"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "yu-knowledge"
path = "src/main.rs"

[dependencies]
# Pinned: the knowledge/profile databases must be readable by any later build.
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
