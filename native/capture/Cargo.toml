[package]
name = "yu-capture"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
